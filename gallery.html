<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="CSS/1style.css">
    <script src="script.js"></script>
</body>
</head>

<body>

    <!-- HEADER -->
    <header>

    <div class="logo-container">

        <img src="Images/Business logo.png"
             alt="Brew Haven Coffee Shop Logo"
             class="logo">

        

    </div>

    <nav class="main-nav">

        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="aboutus.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>

    </nav>

</header>

    <!-- MAIN CONTENT -->
    <main>

        <div class="gallery-wrapper">

            <!-- COFFEE GALLERY -->
            <section class="gallery-section">

                <h2>Our Coffee</h2>

                <div class="image-grid">

                    <div class="image-card">
                        <img src="Images/image1.jpg" alt="Latte Art">
                    </div>

                    <div class="image-card">
                        <img src="Images/image3.jpg" alt="Freshly Made Coffee">
                    </div>

                    <div class="image-card">
                        <img src="Images/image4.jpg" alt="Double Trouble Coffee">
                    </div>

                </div>

            </section>

            <!-- SHOP GALLERY -->
            <section class="gallery-section">

                <h2>Our Shop</h2>

                <div class="image-grid">

                    <div class="image-card">
                        <img src="Images/image2.jpg" alt="Coffee shop interior perfect for photos">
                    </div>

                    <div class="image-card">
                        <img src="Images/image5.jpg" alt="Aesthetic coffee space">
                    </div>

                    <div class="image-card">
                        <img src="Images/image6.jpg" alt="Warm and cozy environment">
                    </div>

                </div>

            </section>

        </div>

    </main>

    <div id="lightbox" class="lightbox">

    <span class="close-btn">&times;</span>

    <img id="lightbox-img" src="" alt="Enlarged Gallery Image">

</div>

    <!-- FOOTER -->
    <footer>

        <div class="footer-container">
            &copy; 2026 Brew Haven Coffee Shop
        </div>

    </footer>

</body>
